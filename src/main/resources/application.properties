spring.config.import=optional:file:.env[.properties]

spring.application.name=sistema-gestionB

# Conexion a PostgreSQL - usa la base sistema_db que ya creaste en Semana 3
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sistema_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate: crea/actualiza tablas automaticamente al arrancar (lo vemos a fondo en Semana 4)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Puerto del servidor
server.port=8000

# Swagger UI disponible en /docs
springdoc.swagger-ui.path=/docs